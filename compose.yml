name: haiqu-erp

services:
  postgres:
    image: public.ecr.aws/docker/library/postgres:17-alpine
    container_name: haiqu-postgres
    restart: unless-stopped
    env_file:
      - .env
    environment:
      PGDATA: /var/lib/postgresql/data/pgdata
    ports:
      - "127.0.0.1:${POSTGRES_HOST_PORT:-5432}:5432"
    volumes:
      - type: bind
        source: ./data/postgres
        target: /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s
    logging:
      driver: local
      options:
        max-size: "10m"
        max-file: "3"

  redis:
    image: public.ecr.aws/docker/library/redis:7.4-alpine
    container_name: haiqu-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--appendfsync", "everysec"]
    ports:
      - "127.0.0.1:${REDIS_HOST_PORT:-6380}:6379"
    volumes:
      - type: bind
        source: ./data/redis
        target: /data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 5s
    logging:
      driver: local
      options:
        max-size: "10m"
        max-file: "3"

  backend:
    build:
      context: ./src/backend
      dockerfile: Dockerfile
    container_name: haiqu-backend
    restart: unless-stopped
    init: true
    env_file:
      - .env
    environment:
      DJANGO_ALLOWED_HOSTS: "localhost,127.0.0.1,backend,${LAN_IP:-127.0.0.1}"
      CORS_ALLOWED_ORIGINS: "http://localhost:5173,http://127.0.0.1:5173,http://${LAN_IP:-127.0.0.1}:5173"
      CSRF_TRUSTED_ORIGINS: "http://localhost:5173,http://127.0.0.1:5173,http://${LAN_IP:-127.0.0.1}:5173"
    ports:
      - "0.0.0.0:8000:8000"
    volumes:
      - type: bind
        source: ./src/backend
        target: /app
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: ["sh", "-c", "python wait_for_services.py && python manage.py runserver 0.0.0.0:8000"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health/', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    logging:
      driver: local
      options:
        max-size: "10m"
        max-file: "3"

  frontend:
    build:
      context: ./src/frontend
      dockerfile: Dockerfile
    container_name: haiqu-frontend
    restart: unless-stopped
    init: true
    environment:
      VITE_API_BASE_URL: "http://${LAN_IP:-127.0.0.1}:8000"
    ports:
      - "0.0.0.0:5173:5173"
    volumes:
      - type: bind
        source: ./src/frontend
        target: /app
      - frontend_node_modules:/app/node_modules
    depends_on:
      backend:
        condition: service_healthy
    command: ["npm", "run", "dev", "--", "--host", "0.0.0.0"]
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:5173').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    logging:
      driver: local
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  frontend_node_modules:
