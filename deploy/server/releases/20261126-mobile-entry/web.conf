map $http_x_forwarded_proto $erp_forwarded_proto {
    default $scheme;
    https https;
    http http;
}

# 回调查询携带一次性授权码，内层代理不记录此路由的原始请求行。
map $uri $erp_access_loggable {
    default 1;
    /api/auth/wecom/callback/ 0;
}

map "$request_method:$http_sec_ch_ua_mobile:$http_user_agent" $erp_mobile_request {
    default 0;
    ~^(GET|HEAD):[?]1: 1;
    ~*^(GET|HEAD):[^:]*:.*(Android|Mobile|iPhone|iPod|iPad|HarmonyOS|Windows.Phone) 1;
}

map $arg_task_number $erp_mobile_wage_query {
    default "";
    "~^[A-Za-z0-9_-]{1,80}$" "?task_number=$arg_task_number";
}

map $arg_craft_id $erp_mobile_craft_query {
    default "";
    "~*^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$" "&craft_id=$arg_craft_id";
}

map "$arg_schedule_product_id:$arg_workshop_id:$arg_plan_category" $erp_mobile_report_page {
    default "/m/production-report?view=records";
    "~^[0-9A-Fa-f]{8}-[0-9A-Fa-f]{4}-[0-9A-Fa-f]{4}-[0-9A-Fa-f]{4}-[0-9A-Fa-f]{12}:[0-9A-Fa-f]{8}-[0-9A-Fa-f]{4}-[0-9A-Fa-f]{4}-[0-9A-Fa-f]{4}-[0-9A-Fa-f]{12}:(METAL|CUTTING|SEWING|ASSEMBLY)$" "/m/report-records?schedule_product_id=$arg_schedule_product_id&workshop_id=$arg_workshop_id&plan_category=$arg_plan_category$erp_mobile_craft_query";
}

map $uri $erp_mobile_page {
    default /m/;
    /index.html /m/;
    ~^/(m|api|admin|auth|assets|static|media|\.well-known|__health)(/|$) "";
    ~^/login/?$ /m/login;
    ~^/workshop/configuration/?$ /m/configuration;
    ~^/workshop/wage-schemes(/|$) /m/wage-schemes$erp_mobile_wage_query;
    ~^/workshop/work-reports/new/?$ /m/production-report;
    ~^/workshop/work-reports(/|$) $erp_mobile_report_page;
    ~^/workshop/material-issues/new/?$ /m/;
    ~^/workshop/material-issues(/|$) /m/issue-records;
    ~^/inventory/(semi-finished|finished-goods)/receive/?$ /m/production-receipt;
    ~\.[^/]+$ "";
}

map $erp_mobile_request $erp_mobile_redirect {
    default "";
    1 $erp_mobile_page;
}

map $erp_mobile_redirect $erp_desktop_cache {
    default "private, no-store";
    "" "no-cache";
}

server {
    listen 80;
    server_name erp.cnhitree.com;
    server_tokens off;
    access_log /var/log/nginx/access.log combined if=$erp_access_loggable;
    client_max_body_size 100m;

    root /usr/share/nginx/html;
    index index.html;

    location = /__health {
        access_log off;
        return 204;
    }

    # AI remains on the local ERP for this release; do not enqueue website operations.
    location ~ ^/api/v1/(codex-connection|production-task-imports)(/|$) {
        default_type application/json;
        charset utf-8;
        add_header Cache-Control "no-store" always;
        return 503 '{"error":{"code":"AI_NOT_ENABLED","message":"服务器暂未启用 AI 导入，请在本机 ERP 使用。"}}';
    }

    location ~ ^/(api|admin)(/|$) {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $erp_forwarded_proto;
        proxy_connect_timeout 5s;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }

    location /static/ {
        alias /app/staticfiles/;
        autoindex off;
    }

    # 业务文件只能通过带权限校验的 API 获取，禁止将 media 当作公开静态目录。
    location /media/ {
        return 404;
    }

    location = /m { return 302 /m/; }

    location = /m/index.html {
        add_header Cache-Control "no-cache";
    }

    location /m/ {
        try_files $uri $uri/ /m/index.html;
    }

    location /assets/ {
        try_files $uri =404;
    }

    location = /index.html {
        absolute_redirect off;
        add_header Vary "User-Agent, Sec-CH-UA-Mobile" always;
        add_header Cache-Control $erp_desktop_cache always;
        if ($erp_mobile_redirect != "") { return 302 $erp_mobile_redirect; }
    }

    location / {
        absolute_redirect off;
        add_header Vary "User-Agent, Sec-CH-UA-Mobile" always;
        add_header Cache-Control $erp_desktop_cache always;
        if ($erp_mobile_redirect != "") { return 302 $erp_mobile_redirect; }
        try_files $uri $uri/ /index.html;
    }
}
