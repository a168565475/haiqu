map $http_x_forwarded_proto $erp_forwarded_proto {
    default $scheme;
    https https;
    http http;
}

# 回调查询携带一次性授权码，内层代理不记录此路由的原始请求行。
map $uri $erp_access_loggable {
    default 1;
    /api/auth/wecom/callback/ 0;
}

server {
    listen 80;
    server_name erp.cnhitree.com;
    server_tokens off;
    access_log /var/log/nginx/access.log combined if=$erp_access_loggable;
    client_max_body_size 100m;

    root /usr/share/nginx/html;
    index index.html;

    location = /__health {
        access_log off;
        return 204;
    }

    location ~ ^/(api|admin)(/|$) {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $erp_forwarded_proto;
        proxy_connect_timeout 5s;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }

    location /static/ {
        alias /app/staticfiles/;
        autoindex off;
    }

    # 业务文件只能通过带权限校验的 API 获取，禁止将 media 当作公开静态目录。
    location /media/ {
        return 404;
    }

    location /assets/ {
        try_files $uri =404;
    }

    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
