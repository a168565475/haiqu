<main><h1>金工半成品入库 · 待确认设计</h1>
<div class="note"><p>入口不变：生产车间 → 内部计划 → 金工计划 → 产品行“更多” → 半成品入库。此处为示例图，业务尚未开发，没有写入库存。</p><p>本次审图：入库主页面、最低报工依据弹窗、提交确认弹窗。表头44px、行40px、控件32px；日期和下拉沿用计划排产，弹窗沿用ERP窗口，聚焦为主题色。</p><p>业务变化：取消勾选；可部分入未喷塑公共库；上限按订单净需求、实领投入、最低报工取小后，扣除已入、已直发及待发预留。空白/0跳过，普通数量错误用气泡；表格后直接接备注。</p></div>
