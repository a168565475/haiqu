server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # 真实 ERP 认证。保留原始 Host/Origin，使浏览器同源 CSRF 校验正常执行。
    location ~ ^/erp-api/auth/(login|logout)/$ {
        limit_except POST { deny all; }
        rewrite ^/erp-api/(.*)$ /api/$1 break;
        proxy_pass http://host.docker.internal:8000;
        proxy_set_header Host $http_host;
        proxy_set_header Authorization "";
        proxy_connect_timeout 5s;
        proxy_read_timeout 20s;
        add_header Cache-Control "no-store" always;
    }

    # 客户、客诉与询盘业务只读，不转发模板演示 Token。
    location ~ ^/erp-api/(auth/me/|v1/((customers|complaints)/(options/)?|inquiries/((options|export)/)?))$ {
        limit_except GET { deny all; }
        rewrite ^/erp-api/(.*)$ /api/$1 break;
        proxy_pass http://host.docker.internal:8000;
        proxy_set_header Host $http_host;
        proxy_set_header Authorization "";
        proxy_connect_timeout 5s;
        proxy_read_timeout 20s;
        add_header Cache-Control "no-store" always;
    }

    # 询盘详情及子资源只读；不能通过详情代理调用状态变更或上传接口。
    location ~ "^/erp-api/v1/(inquiries/[0-9a-fA-F-]{36}/((timeline|tasks|files-download)/|files/[0-9a-fA-F-]{36}/download/)?|inquiry-items/[0-9a-fA-F-]{36}/product-image/)$" {
        limit_except GET { deny all; }
        rewrite ^/erp-api/(.*)$ /api/$1 break;
        proxy_pass http://host.docker.internal:8000;
        proxy_set_header Host $http_host;
        proxy_set_header Authorization "";
        proxy_connect_timeout 5s;
        proxy_read_timeout 60s;
        add_header Cache-Control "no-store" always;
    }

    # 客户详情、联系人/时间轴及关联业务列表；所有业务写入继续拒绝。
    location ~ "^/erp-api/v1/(customers/[0-9a-fA-F-]{36}/((summary|contacts|timeline|entities)/)?|customer-entities/[0-9a-fA-F-]{36}/addresses/|(tasks|quotations|sample-requests|sales-orders)/(options/)?)$" {
        limit_except GET { deny all; }
        rewrite ^/erp-api/(.*)$ /api/$1 break;
        proxy_pass http://host.docker.internal:8000;
        proxy_set_header Host $http_host;
        proxy_set_header Authorization "";
        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
        add_header Cache-Control "no-store" always;
    }

    location /erp-api/ {
        return 404;
    }

    # 旧缓存页面也不能把输入的 ERP 凭据提交给演示认证服务。
    location ~ ^/demo-api/auth/(login|getUserInfo|refreshToken)/?$ {
        return 410;
    }

    # 其他示例继续使用模板公开演示服务，与 ERP 认证隔离。
    location /demo-api/ {
        proxy_pass https://mock.apifox.cn/m1/3109515-0-default/;
        proxy_set_header Host mock.apifox.cn;
        # Cookie 不按端口隔离，禁止将本机其他应用的 Cookie 发往演示服务。
        proxy_set_header Cookie "";
        proxy_hide_header Set-Cookie;
        proxy_ssl_server_name on;
        proxy_ssl_verify on;
        proxy_ssl_trusted_certificate /etc/ssl/certs/ca-certificates.crt;
        proxy_connect_timeout 10s;
        proxy_read_timeout 30s;
    }

    location = /index.html {
        add_header Cache-Control "no-store";
    }

    location /assets/ {
        try_files $uri =404;
        expires 1y;
    }

    # Vue history 路由刷新时交回前端；/assets/ 下资源缺失仍返回 404。
    location / {
        try_files $uri $uri/ /index.html;
    }
}
